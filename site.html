<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nossa Historia ❤️</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #18091c;
}

#pagina {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>

<body>

<iframe
  id="pagina"
  src="inicio.html"
  title="Nossa historia">
</iframe>

<audio
  id="musica-global"
  src="musicas/musica-nova.mp3"
  preload="auto"
  loop>
</audio>

<script>
const pagina = document.getElementById("pagina");
const musica = document.getElementById("musica-global");

musica.volume = 0.5;

function tocarMusica() {
  if (!musica.paused) return;

  musica.play().catch(() => {
    // O navegador pode exigir um clique.
  });
}

function navegar(destino) {
  const permitidas = [
    "inicio.html",
    "historia.html",
    "jogo.html",
    "motivos.html"
  ];

  if (!permitidas.includes(destino)) return;

  tocarMusica();

  if (pagina.getAttribute("src") !== destino) {
    pagina.src = destino;
  }
}

window.navegar = navegar;

document.addEventListener("pointerdown", tocarMusica);
document.addEventListener("keydown", tocarMusica);

pagina.addEventListener("load", function () {
  try {
    const doc = pagina.contentDocument;

    if (!doc) return;

    // Desativar musica duplicada nas paginas internas.
    doc.querySelectorAll("audio").forEach(audio => {
      audio.pause();
      audio.muted = true;
      audio.removeAttribute("autoplay");
    });

    doc.addEventListener("pointerdown", tocarMusica);
    doc.addEventListener("keydown", tocarMusica);

    // Capturar links que ainda nao foram tratados.
    doc.addEventListener("click", function (evento) {
      const link = evento.target.closest("a[href]");
      if (!link) return;

      const href = link.getAttribute("href");

      try {
        const url = new URL(href, doc.baseURI);

        if (url.origin !== location.origin) return;

        let destino = url.pathname.split("/").pop();

        if (destino === "index.html") {
          destino = "inicio.html";
        }

        if ([
          "inicio.html",
          "historia.html",
          "jogo.html",
          "motivos.html"
        ].includes(destino)) {
          evento.preventDefault();
          navegar(destino);
        }
      } catch {}
    }, true);

  } catch (erro) {
    console.warn("Erro ao configurar pagina:", erro);
  }
});

tocarMusica();
</script>
</body>
</html>
